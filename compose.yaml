services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { if (rs.status().ok === 1) { quit(0) } } catch (e) { if (e.code === 94) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}); quit(0) } else { quit(1) } }\""
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

  api:
    build: .
    ports:
      - "3001:3000"
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/factoryflow?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo_data: